name: Learning Artifacts

on:
  push:

jobs:

  upload:
    runs-on: ubuntu-latest

    steps:
      - run: |
          mkdir output
          echo "Hello from runner-1" >> output/text.txt
      
      - uses: actions/upload-artifact@v7
        with:
          name: my-artifact
          path: output/

  download:
    needs: upload
    runs-on: ubuntu-latest

    steps:
      - uses: actions/download-artifact@v7
        with:
          name: my-artifact
          path: output/
          
      - run: cat output/text.txt



