name: Index File copy

on:
  push:

jobs:
  Copy_Index_File:
    runs-on: ubuntu-latest

    steps:

      - uses: actions/checkout@v4
      - name: Copy files via SSH
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.KEY }}
          port: ${{ secrets.PORT }}
          source: "index.html"
          target: /var/www/html/
